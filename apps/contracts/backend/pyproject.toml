[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contracts-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "anthropic>=0.25",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.9",
]

# phenomenon-engine is installed separately (see Dockerfile / local dev docs)

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build]
exclude = ["adapters"]
